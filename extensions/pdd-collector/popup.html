<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拼多多采集器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <header>
    <h1>拼多多商品采集</h1>
    <button id="open-options" class="link-button">设置</button>
  </header>
  <p id="status" class="status">打开拼多多商品页后开始采集。</p>
  <div class="actions">
    <button id="capture" class="primary">采集当前页面</button>
    <button id="upload" disabled>上传服务端</button>
    <button id="copy" disabled>复制 JSON</button>
  </div>
  <section id="summary" class="summary hidden">
    <div><span>goodsId</span><strong id="goods-id"></strong></div>
    <div><span>标题</span><strong id="title"></strong></div>
    <div><span>SKU 数量</span><strong id="sku-count"></strong></div>
  </section>
  <details id="preview-wrap" class="hidden">
    <summary>查看采集 JSON</summary>
    <pre id="preview"></pre>
  </details>
  <hr>
  <section>
    <h2>评论媒体采集</h2>
    <p>从当前商品评论页采集多张评论图片和普通视频；实况内容仅保存静态图片。</p>
    <div class="actions"><button id="capture-review-media" class="primary">采集评论媒体</button><button id="upload-review-media" disabled>上传评论媒体</button></div>
    <div id="review-media-summary" class="summary hidden"><div><span>商品</span><strong id="review-goods-id"></strong></div><div><span>评论图片</span><strong id="review-image-count"></strong></div><div><span>评论视频</span><strong id="review-video-count"></strong></div></div>
  </section>
  <hr>
  <section>
    <h2>拼多多账号配置</h2>
    <p>从拼多多收货地址页读取当前登录账号的 Cookie、账号 ID 和默认收货地址 ID，仅保存在扩展本地。</p>
    <div class="actions"><button id="capture-account" class="primary">读取账号配置</button><button id="open-address-page" class="hidden">前往地址页</button><button id="copy-account" disabled>复制配置</button></div>
    <div id="account-summary" class="summary hidden"><div><span>站点</span><strong id="pdd-site"></strong></div><div><span>账号</span><strong id="pdd-uid"></strong></div><div><span>地址 ID</span><strong id="pdd-address-id"></strong></div><div><span>Cookie</span><strong id="pdd-cookie"></strong></div></div>
  </section>
  <script type="module" src="popup.js"></script>
</body>
</html>
